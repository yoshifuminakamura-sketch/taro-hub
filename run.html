<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マラソン — TARO</title>
<meta name="theme-color" content="#C9622A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F2; --panel:#FFFFFF; --ink:#22262B; --ink-soft:#5B6169; --line:#DDE1DC;
    --c-run:#C9622A; --c-run-bg:#FBEEE4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.75;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .page{max-width:720px;margin:0 auto;padding:24px 16px 60px;}
  a{color:inherit;text-decoration:none;}

  .detail-head{display:flex;align-items:center;gap:10px;padding:6px 2px 18px;}
  .back{flex:none;display:flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;color:var(--ink-soft);padding:6px 4px;}
  .detail-head .titlewrap{flex:1;}
  .detail-head .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--c-run);}
  .detail-head h2{font-size:20px;font-weight:900;margin-top:2px;}

  .block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px;margin-bottom:14px;}
  .block h4{font-size:13.5px;font-weight:700;margin-bottom:10px;}
  .block .row{display:flex;gap:10px;font-size:14px;padding:7px 0;border-top:1px dotted var(--line);}
  .block .row:first-child{border-top:none;}
  .block .row .k{flex:none;width:84px;color:var(--ink-soft);font-size:12.5px;padding-top:1px;}
  .block .row .v{flex:1;}
  .block .row .v .sub{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
</style>
</head>
<body>
<div class="page">

  <div class="detail-head">
    <a class="back" href="index.html">‹ 一覧</a>
    <span class="titlewrap">
      <span class="eyebrow">体力作り</span>
      <h2>マラソン・トレーニング</h2>
    </span>
  </div>

  <div class="block">
    <h4>大会</h4>
    <div class="row"><span class="k">11/15</span><span class="v">かわさき多摩川マラソン（ハーフ）確定</span></div>
    <div class="row"><span class="k">1〜2月</span><span class="v">新宿シティは締切済み。東京ニューイヤーハーフ or 府中多摩川風の道マラソンを検討中</span></div>
    <div class="row"><span class="k">方針</span><span class="v">大会を3〜4ヶ月おきに構えて継続の推進力にする</span></div>
  </div>

  <div class="block">
    <h4>今のトレーニング</h4>
    <div class="row"><span class="k">フェーズ</span><span class="v">Week4〜7（距離を伸ばすフェーズ）</span></div>
    <div class="row"><span class="k">課題</span><span class="v">心拍が上がりすぎ気味<span class="sub">「しゃべれるが息切れ」状態。ペースを落として調整中</span></span></div>
    <div class="row"><span class="k">延伸計画</span><span class="v">ロング走 6km→8km→10km、その後15〜16kmへ</span></div>
  </div>

</div>
</body>
</html>
