<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マラソン — TARO</title>
<meta name="theme-color" content="#C9622A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F2; --panel:#FFFFFF; --ink:#1A1D21; --ink-soft:#454B52; --line:#D3D8D2;
    --c-run:#C9622A; --c-run-bg:#FBEEE4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.85;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .page{max-width:720px;margin:0 auto;padding:24px 16px 60px;}
  a{color:inherit;text-decoration:none;}

  .detail-head{display:flex;align-items:center;gap:10px;padding:6px 2px 20px;}
  .back{flex:none;display:flex;align-items:center;gap:4px;font-size:16px;font-weight:700;color:var(--c-run);padding:8px 4px;}
  .detail-head .titlewrap{flex:1;}
  .detail-head .eyebrow{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--c-run);}
  .detail-head h2{font-size:24px;font-weight:900;margin-top:3px;}

  .block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 20px;margin-bottom:16px;}
  .block h4{font-size:16px;font-weight:900;margin-bottom:14px;color:var(--ink);}

  .block .row{display:flex;gap:12px;font-size:17px;padding:11px 0;border-top:1px solid var(--line);}
  .block .row:first-child{border-top:none;}
  .block .row .k{flex:none;width:96px;color:var(--ink-soft);font-size:14.5px;font-weight:700;padding-top:2px;}
  .block .row .v{flex:1;}
  .block .row .v .sub{display:block;font-size:15px;color:var(--ink-soft);margin-top:5px;line-height:1.7;}

  .phase-list{display:flex;flex-direction:column;gap:10px;}
  .phase{
    display:flex;align-items:flex-start;gap:14px;
    padding:14px 14px;border-radius:10px;border:1px solid var(--line);
  }
  .phase .num{
    flex:none;width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:900;color:#fff;background:#B7BEC8;
    margin-top:1px;
  }
  .phase.goal .num{background:#2B2F33;}
  .phase .body{flex:1;}
  .phase .body .name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .phase .body .name{font-size:16.5px;font-weight:700;}
  .phase .body .span{font-size:14px;color:var(--ink-soft);margin-top:2px;}
  .phase .body .desc{font-size:14.5px;color:var(--ink-soft);margin-top:5px;line-height:1.7;}
  .phase.now{background:var(--c-run-bg);border-color:var(--c-run);}
  .phase.now .num{background:var(--c-run);}
  .phase.now .body .name{color:var(--c-run);}
  .phase.goal{background:#2B2F33;border-color:#2B2F33;}
  .phase.goal .body .name, .phase.goal .body .span, .phase.goal .body .desc{color:#fff;}
  .phase .tag{
    flex:none;font-size:12px;font-weight:700;color:var(--c-run);
    background:#fff;border:1px solid var(--c-run);border-radius:999px;padding:3px 10px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="detail-head">
    <a class="back" href="index.html">‹ 一覧</a>
    <span class="titlewrap">
      <span class="eyebrow">体力作り</span>
      <h2>マラソン・トレーニング</h2>
    </span>
  </div>

  <div class="block">
    <h4>大会</h4>
    <div class="row"><span class="k">11/15</span><span class="v">かわさき多摩川マラソン（ハーフ）確定</span></div>
    <div class="row"><span class="k">2/14</span><span class="v">GARMIN RUN JAPAN（立川・ハーフ）申込済み</span></div>
    <div class="row"><span class="k">方針</span><span class="v">大会を3〜4ヶ月おきに構えて継続の推進力にする。計画に縛られず、完走＆怪我なしが最優先</span></div>
    <div class="row"><span class="k">11/15</span><span class="v"><a href="https://claude.ai/artifact/LrpY4ynqsQSXpBais6eUm8" target="_blank" rel="noopener" style="color:var(--c-run);font-weight:700;">大会ページ（行動プラン・これまでのトレーニング）</a></span></div>
    <div class="row"><span class="k">その先</span><span class="v">11/15のあと、2/14のGARMIN RUN JAPAN（ハーフ）に向けて、練習を作り直す</span></div>
  </div>

  <div class="block">
    <h4>来年参加してみたい大会</h4>
    <div class="row"><span class="k">候補</span><span class="v">新宿シティ、東京マラソン、横浜マラソン、札幌マラソンなど</span></div>
  </div>

</div>
</body>
</html>
