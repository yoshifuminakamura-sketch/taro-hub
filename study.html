<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学習・資格 — TARO</title>
<meta name="theme-color" content="#1E7F6E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F2; --panel:#FFFFFF; --ink:#22262B; --ink-soft:#5B6169; --line:#DDE1DC;
    --c-study:#1E7F6E; --c-study-bg:#E6F2EF;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.75;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .page{max-width:720px;margin:0 auto;padding:24px 16px 60px;}
  a{color:inherit;text-decoration:none;}

  .detail-head{display:flex;align-items:center;gap:10px;padding:6px 2px 18px;}
  .back{flex:none;display:flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;color:var(--ink-soft);padding:6px 4px;}
  .detail-head .titlewrap{flex:1;}
  .detail-head .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--c-study);}
  .detail-head h2{font-size:20px;font-weight:900;margin-top:2px;}

  .block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px;margin-bottom:14px;}
  .block h4{font-size:13.5px;font-weight:700;margin-bottom:10px;}
  .block .row{display:flex;gap:10px;font-size:14px;padding:7px 0;border-top:1px dotted var(--line);}
  .block .row:first-child{border-top:none;}
  .block .row .k{flex:none;width:84px;color:var(--ink-soft);font-size:12.5px;padding-top:1px;}
  .block .row .v{flex:1;}
  .block .row .v .sub{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
</style>
</head>
<body>
<div class="page">

  <div class="detail-head">
    <a class="back" href="index.html">‹ 一覧</a>
    <span class="titlewrap">
      <span class="eyebrow">学習</span>
      <h2>学習・資格ロードマップ</h2>
    </span>
  </div>

  <div class="block">
    <h4>資格ロードマップ</h4>
    <div class="row"><span class="k">生成AI Pass</span><span class="v">10月受験・進捗7割</span></div>
    <div class="row"><span class="k">G検定</span><span class="v">11/7受験確定・進捗4〜5割<span class="sub">問題集周回中。苦手は「用語タイムマップ」で補強</span></span></div>
    <div class="row"><span class="k">AWS CP</span><span class="v">12月予定</span></div>
    <div class="row"><span class="k">Dify</span><span class="v">2027年1月・分身AIの偵察</span></div>
    <div class="row"><span class="k">統計検定3級</span><span class="v">2027年2月・診断士の前段階</span></div>
    <div class="row"><span class="k">中小企業診断士</span><span class="v">2028年4月独立後を見据え本格化<span class="sub">1000〜1200h、月100h目安</span></span></div>
  </div>

</div>
</body>
</html>
