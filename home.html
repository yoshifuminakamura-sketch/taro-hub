<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>実家・両親 — TARO</title>
<meta name="theme-color" content="#B23A63">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F2; --panel:#FFFFFF; --ink:#22262B; --ink-soft:#5B6169; --line:#DDE1DC;
    --c-home:#B23A63; --c-home-bg:#FAEBF0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.75;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .page{max-width:720px;margin:0 auto;padding:24px 16px 60px;}
  a{color:inherit;text-decoration:none;}

  .detail-head{display:flex;align-items:center;gap:10px;padding:6px 2px 18px;}
  .back{flex:none;display:flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;color:var(--ink-soft);padding:6px 4px;}
  .detail-head .titlewrap{flex:1;}
  .detail-head .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--c-home);}
  .detail-head h2{font-size:20px;font-weight:900;margin-top:2px;}

  .block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px;margin-bottom:14px;}
  .block h4{font-size:13.5px;font-weight:700;margin-bottom:10px;}
  .block .row{display:flex;gap:10px;font-size:14px;padding:7px 0;border-top:1px dotted var(--line);}
  .block .row:first-child{border-top:none;}
  .block .row .k{flex:none;width:84px;color:var(--ink-soft);font-size:12.5px;padding-top:1px;}
  .block .row .v{flex:1;}
  .block .row .v .sub{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .block ul.plain{list-style:none;}
  .block ul.plain li{font-size:14px;padding:7px 0;border-top:1px dotted var(--line);}
  .block ul.plain li:first-child{border-top:none;}
</style>
</head>
<body>
<div class="page">

  <div class="detail-head">
    <a class="back" href="index.html">‹ 一覧</a>
    <span class="titlewrap">
      <span class="eyebrow">実家</span>
      <h2>実家・両親のこと</h2>
    </span>
  </div>

  <div class="block">
    <h4>鬼怒川旅行（10/5-6）</h4>
    <div class="row"><span class="k">状態</span><span class="v">しおり確定済み</span></div>
    <div class="row"><span class="k">EV充電</span><span class="v">eMP利用、羽生PA（行き）・佐野SA（帰り）で急速充電</span></div>
    <div class="row"><span class="k">同時実施</span><span class="v">父のスマホ移行もこの旅行中に</span></div>
  </div>

  <div class="block">
    <h4>その他の実家関連</h4>
    <ul class="plain">
      <li>サプリ　マグネシウムを1人1粒/日へ切替、3か月周期の配送に見直し</li>
      <li>ふるさと納税　いつものフルーツに加え、帆立と餃子を検討中</li>
      <li>両親の旅行構想　四国・宮島・彦根城・松島など、紅葉に合わせた旅館の仮押さえ（鬼怒川とは別件、まだ着手前）</li>
      <li>資産整理　マネックス証券→ゆうちょ銀行へ、次回実家訪問時に</li>
    </ul>
  </div>

</div>
</body>
</html>
