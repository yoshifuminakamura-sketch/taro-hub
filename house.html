<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家のこと — TARO</title>
<meta name="theme-color" content="#6B4FA0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F2; --panel:#FFFFFF; --ink:#1A1D21; --ink-soft:#454B52; --line:#D3D8D2;
    --c-house:#6B4FA0; --c-house-bg:#EFEBF6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.85;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .page{max-width:720px;margin:0 auto;padding:24px 16px 60px;}
  a{color:inherit;text-decoration:none;}

  .detail-head{display:flex;align-items:center;gap:10px;padding:6px 2px 20px;}
  .back{flex:none;display:flex;align-items:center;gap:4px;font-size:16px;font-weight:700;color:var(--c-house);padding:8px 4px;}
  .detail-head .titlewrap{flex:1;}
  .detail-head .eyebrow{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--c-house);}
  .detail-head h2{font-size:24px;font-weight:900;margin-top:3px;}

  .block{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 20px;margin-bottom:16px;}
  .block h4{font-size:16px;font-weight:900;margin-bottom:14px;color:var(--ink);}

  .lead-block{
    background:var(--c-house-bg);border:1px solid var(--c-house);
    border-radius:14px;padding:18px 20px;margin-bottom:16px;
  }
  .lead-block p{font-size:17px;font-weight:700;color:var(--c-house);}
  .lead-block p.sub{font-size:14.5px;font-weight:500;color:var(--ink-soft);margin-top:6px;}

  .block ul.plain{list-style:none;}
  .block ul.plain li{font-size:17px;font-weight:700;padding:12px 0;border-top:1px solid var(--line);}
  .block ul.plain li:first-child{border-top:none;}
  .block ul.plain li .sub{display:block;font-size:15px;font-weight:400;color:var(--ink-soft);margin-top:4px;line-height:1.7;}
</style>
</head>
<body>
<div class="page">

  <div class="detail-head">
    <a class="back" href="index.html">‹ 一覧</a>
    <span class="titlewrap">
      <span class="eyebrow">家のこと</span>
      <h2>暮らしの管理</h2>
    </span>
  </div>

  <div class="lead-block">
    <p>家まわりのやることを、ここにまとめる</p>
    <p class="sub">項目ごとの状況は、動きがあったら更新していく</p>
  </div>

  <div class="block">
    <h4>項目</h4>
    <ul class="plain">
      <li>防災対策<span class="sub">「防災ルール わが家」v3を作成済み</span></li>
      <li>帳簿つけ<span class="sub">これから整理</span></li>
      <li>資産管理<span class="sub">これから整理</span></li>
      <li>大阪の計画・手配<span class="sub">12/25〜1/1。旅のしおり作成済み、新幹線（往復）は11月上旬に予約</span></li>
      <li>衣替え<span class="sub">これから整理</span></li>
      <li>押し入れの整理<span class="sub">これから整理</span></li>
    </ul>
  </div>

</div>
</body>
</html>
